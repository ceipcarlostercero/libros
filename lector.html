<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lector · C.E.I.P. Carlos III</title>
<meta name="description" content="Lector de libros del C.E.I.P. Carlos III: una o dos páginas, zoom y giro.">
<link rel="icon" href="logocarlosiii.png">
<style>
  :root { --bg:#1e2126; --bar:rgba(20,22,26,.92); --fg:#eef0f3; --muted:#9aa3ad; --acc:#f5c518; --paper:#f4f0e6; }
  * { box-sizing:border-box; }
  html, body { touch-action:none; margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0 0 56px 0; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #stage.pan { cursor:grab; } #stage.drag { cursor:grabbing; }
  #book { position:absolute; transform-origin:50% 50%; }
  #book.anim { transition:transform .32s cubic-bezier(.2,.7,.2,1); }
  #book .pg { position:absolute; top:0; height:100%; overflow:hidden; background:#fff; }
  #book .slot, #under { box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #book img { display:block; width:100%; height:100%; object-fit:fill; pointer-events:none; -webkit-user-drag:none; }
  #book .paper { background:var(--paper); } #book .paper img { visibility:hidden; }
  #under { z-index:1; } #book .slot { z-index:2; } #fsheet { z-index:3; }
  #gutter { position:absolute; top:0; height:100%; z-index:4; pointer-events:none;
    background:linear-gradient(to right, transparent, rgba(0,0,0,.2) 46%, rgba(0,0,0,.28) 50%, rgba(0,0,0,.16) 54%, transparent); }
  .clip { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .clip > i { position:absolute; display:block; }
  #shadeU { z-index:5; } #shadeF { z-index:6; } #backWrap { z-index:7; } #shadeB { z-index:8; }
  #back { transform-origin:0 0; }
  .fl { display:none; } #book.flip .fl { display:block; }
  #bar { position:fixed; left:0; right:0; bottom:0; height:56px; background:var(--bar); display:flex; align-items:center;
    gap:4px; padding:0 8px; border-top:1px solid rgba(255,255,255,.08); }
  #bar button, #home { flex:none; width:40px; height:40px; border:0; border-radius:10px; background:transparent; color:var(--fg);
    display:grid; place-items:center; cursor:pointer; font:600 13px system-ui; }
  #bar button:hover, #home:hover { background:rgba(255,255,255,.1); }
  #bar svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #home { color:var(--fg); }
  #slider { flex:1 1 auto; min-width:40px; accent-color:var(--acc); }
  #lbl { flex:none; min-width:84px; text-align:center; font-variant-numeric:tabular-nums; color:var(--muted); font-size:13px; }
  .sep { width:1px; height:26px; background:rgba(255,255,255,.12); margin:0 4px; flex:none; }
  @media (max-width:640px) {
    #bar { gap:0; padding:0 2px; } #bar button { width:34px; } .sep, .hm { display:none; } #lbl { min-width:62px; font-size:12px; }
  }
</style>
</head>
<body>
<div id="stage"><div id="book">
  <div class="pg fl" id="under"><img alt=""></div>
  <div class="pg slot"><img alt=""></div><div class="pg slot"><img alt=""></div>
  <div class="pg fl" id="fsheet"><img alt=""></div>
  <div id="gutter"></div>
  <div class="clip fl" id="shadeU"><i></i></div>
  <div class="clip fl" id="shadeF"><i></i></div>
  <div class="clip fl" id="backWrap"><div class="pg" id="back"><img alt=""></div></div>
  <div class="clip fl" id="shadeB"><i></i></div>
</div></div>
<div id="bar">
  <a id="home" href="./" title="Biblioteca"><svg viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg></a>
  <button id="prev" title="Anterior (←)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span id="lbl"></span>
  <button id="next" title="Siguiente (→)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <input id="slider" type="range" min="0" max="96" value="0" aria-label="Página">
  <span class="sep"></span>
  <button id="mode" title="Una / dos páginas (D)"></button>
  <button id="rotl" title="Girar a la izquierda (Mayús+R)"><svg viewBox="0 0 24 24"><path d="M4 4v5h5"/><path d="M4.5 9A8 8 0 1 1 4 12"/></svg></button>
  <button id="rotr" title="Girar a la derecha (R)"><svg viewBox="0 0 24 24"><path d="M20 4v5h-5"/><path d="M19.5 9A8 8 0 1 0 20 12"/></svg></button>
  <span class="sep"></span>
  <button id="zout" class="hm" title="Alejar (−)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-4-4"/></svg></button>
  <button id="zin" class="hm" title="Acercar (+)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-4-4"/></svg></button>
  <button id="fit" title="Ajustar a la pantalla (0)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><rect x="8" y="8.5" width="6" height="5" rx=".5"/><path d="M20 20l-4-4"/></svg></button>
  <button id="full" title="Pantalla completa (F)"><svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg></button>
</div>
<script>document.write('<script src="libros.js?v=' + Date.now() + '"><\/script>');</script>
<script>
(function () {
  'use strict';
  var id = new URLSearchParams(location.search).get('libro');
  var BK = LIBROS.filter(function (b) { return b.id === id; })[0];
  if (!BK) { location.replace('./'); return; }
  document.title = BK.titulo + ' · C.E.I.P. Carlos III';
  var N = BK.paginas, LAST = N - 1, AR = BK.ancho / BK.alto;   // todas las páginas se estiran a esta proporción
  var KEY = 'libro-' + BK.id;
  var ZMIN = 1, ZMAX = 4;                              // más zoom no aporta detalle y satura la memoria en móviles
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), book = $('book'), slider = $('slider'), lbl = $('lbl');
  var slots = book.querySelectorAll('.slot');
  slider.max = LAST;
  var under = $('under'), fsheet = $('fsheet'), back = $('back'), backWrap = $('backWrap'), gutter = $('gutter');
  var shadeU = $('shadeU'), shadeF = $('shadeF'), shadeB = $('shadeB');
  var src = function (i) { return BK.id + '/p' + String(i).padStart(3, '0') + '.webp'; };

  var S = { two: innerWidth > innerHeight, page: 0, rot: 0, z: 1, x: 0, y: 0 };
  try { var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if (sv) { S.two = !!sv.two; S.page = sv.page | 0; S.rot = sv.rot | 0; } } catch (e) {}
  var hp = /p=(\d+)/.exec(location.hash); if (hp) S.page = +hp[1];
  S.page = Math.max(0, Math.min(LAST, S.page));
  var fit = 1, vw = 0, vh = 0, pw = 1, H = 1, n = 1;

  // ---- Páginas ----
  function pages(p) {
    if (!S.two || p === 0) return [p];
    var l = p % 2 ? p : p - 1;                          // portada sola; luego pares (1-2), (3-4)...
    return l + 1 <= LAST ? [l, l + 1] : [l];
  }
  var cache = {};
  function load(i) {
    if (i < 0 || i > LAST) return null;
    if (!cache[i]) { var im = new Image(); im.decoding = 'async'; im.src = src(i);
      cache[i] = (im.decode ? im.decode() : Promise.resolve()).catch(function () {}).then(function () { return im.src; }); }
    return cache[i];
  }
  var tok = 0;
  function show(p, keepView, done) {
    S.page = p = Math.max(0, Math.min(LAST, p));
    var ps = pages(p), t = ++tok;
    Promise.all(ps.map(load)).then(function (u) {
      if (t !== tok) return;
      n = ps.length;
      slots[0].firstChild.src = u[0];
      if (u[1]) slots[1].firstChild.src = u[1];
      slots[1].style.display = n === 2 ? '' : 'none';
      gutter.style.display = n === 2 ? '' : 'none';
      if (!keepView) { S.z = 1; S.x = S.y = 0; }
      if (done) done();
      layout();
    });
    lbl.textContent = p === 0 ? 'Portada' : 'Pág. ' + ps.map(function (i) { return i + 1; }).join('–');
    slider.value = p;
    for (var d = 1; d <= 4; d++) { load(p + d); load(p - d); }   // precarga alrededor
    save();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ two: S.two, page: S.page, rot: S.rot })); } catch (e) {}
    history.replaceState(null, '', '#p=' + S.page);
  }

  // ---- Geometría ----
  function quarter() { return (((S.rot / 90) % 2) + 2) % 2 === 1; }
  function layout() {
    vw = stage.clientWidth; vh = stage.clientHeight;
    var w = n * AR, bw = quarter() ? 1 : w, bh = quarter() ? w : 1;
    fit = Math.min(vw * 0.96 / bw, vh * 0.96 / bh);
    H = fit; pw = AR * fit;
    book.style.width = n * pw + 'px'; book.style.height = H + 'px';
    book.style.left = (vw - n * pw) / 2 + 'px'; book.style.top = (vh - H) / 2 + 'px';
    [slots[0], slots[1], under, fsheet, back].forEach(function (el) { el.style.width = pw + 'px'; });
    slots[1].style.left = pw + 'px';
    gutter.style.left = pw * 0.94 + 'px'; gutter.style.width = pw * 0.12 + 'px';
    apply();
  }
  function clamp() {
    var w = n * pw * S.z, h = H * S.z;
    if (quarter()) { var t = w; w = h; h = t; }
    var mx = Math.max(0, (w - vw) / 2 + 20), my = Math.max(0, (h - vh) / 2 + 20);
    if (S.z <= 1) mx = my = 0;
    S.x = Math.max(-mx, Math.min(mx, S.x)); S.y = Math.max(-my, Math.min(my, S.y));
  }
  function apply() {
    if (!isFinite(S.x) || !isFinite(S.y) || !isFinite(S.z)) { S.x = S.y = 0; S.z = 1; }
    clamp();
    book.style.transform = 'translate(' + S.x + 'px,' + S.y + 'px) rotate(' + S.rot + 'deg) scale(' + S.z + ')';
    stage.classList.toggle('pan', S.z > 1);
  }
  function zoomAt(z, cx, cy) {             // cx, cy relativos al centro del escenario
    z = Math.max(ZMIN, Math.min(ZMAX, z));
    var k = z / S.z; S.x = cx - (cx - S.x) * k; S.y = cy - (cy - S.y) * k; S.z = z; apply();
  }
  function animated(fn) {
    book.classList.add('anim'); fn();
    clearTimeout(animated.t); animated.t = setTimeout(function () { book.classList.remove('anim'); }, 340);
  }
  function rel(e) { var r = stage.getBoundingClientRect(); return [e.clientX - r.left - vw / 2, e.clientY - r.top - vh / 2]; }
  function toLocal(e) {                    // punto de pantalla -> coordenadas del libro (sin giro ni zoom)
    var c = rel(e), a = -S.rot * Math.PI / 180, dx = c[0] - S.x, dy = c[1] - S.y;
    return { x: (dx * Math.cos(a) - dy * Math.sin(a)) / S.z + n * pw / 2, y: (dx * Math.sin(a) + dy * Math.cos(a)) / S.z + H / 2 };
  }

  // ---- Paso de hoja con pliegue ----
  // Hoja articulada en x = h; la esquina C sigue al punto P. La línea de pliegue es la mediatriz de CP.
  var F = null;
  function clipHalf(poly, M, u, keep) {    // keep = +1: lado de C; -1: lado de P
    var out = [], side = function (p) { return ((p.x - M.x) * u.x + (p.y - M.y) * u.y) * keep; };
    for (var i = 0; i < poly.length; i++) {
      var a = poly[i], b = poly[(i + 1) % poly.length], sa = side(a), sb = side(b);
      if (sa >= 0) out.push(a);
      if ((sa >= 0) !== (sb >= 0)) { var t = sa / (sa - sb); out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }); }
    }
    return out;
  }
  function poly(pts, ox) {
    if (pts.length < 3) return 'polygon(0 0,0 0,0 0)';
    return 'polygon(' + pts.map(function (p) { return (p.x - ox).toFixed(1) + 'px ' + p.y.toFixed(1) + 'px'; }).join(',') + ')';
  }
  function setImg(el, i) {
    el.classList.toggle('paper', i == null);
    if (i != null) { var im = el.firstChild; im.src = src(i); }
  }
  function flipSetup(dir, y) {
    if (F || dir > 0 && S.page >= LAST || dir < 0 && S.page <= 0) return null;
    var ps = pages(S.page), f = { dir: dir, hide: null, under: null, ux: 0 };
    if (n === 2 && dir > 0) {                              // doble, adelante: gira la hoja derecha
      var nx = pages(ps[1] + 1);
      f.h = pw; f.x0 = pw; f.front = ps[1]; f.hide = 1; f.back = nx[0]; f.under = nx[1]; f.ux = pw;
      f.C = { x: 2 * pw, y: y }; f.to = nx[0];
    } else if (n === 2 && dir < 0) {                       // doble, atrás: gira la hoja izquierda
      var pv = pages(ps[0] - 1);
      f.h = pw; f.x0 = 0; f.front = ps[0]; f.hide = 0; f.back = pv[pv.length - 1]; f.under = pv.length === 2 ? pv[0] : null;
      f.C = { x: 0, y: y }; f.to = pv[0];
    } else if (dir > 0) {                                  // una página (o portada), adelante
      var to = S.two ? pages(S.page + 1)[0] : S.page + 1;
      f.h = 0; f.x0 = 0; f.front = S.page; f.hide = 0; f.back = null; f.under = to; f.C = { x: pw, y: y }; f.to = to;
    } else {                                               // una página, atrás: la anterior vuelve desde la izquierda
      f.h = 0; f.x0 = 0; f.front = S.page - 1; f.back = null; f.C = { x: pw, y: y }; f.to = S.page - 1; f.rev = true;
    }
    f.k = n === 2 ? 1 : 2;
    f.M = { x: 2 * f.h - f.C.x, y: y };                    // posición de la esquina con la hoja ya pasada
    f.P0 = f.rev ? f.M : f.C; f.P1 = f.rev ? f.C : f.M;
    f.P = { x: f.P0.x, y: f.P0.y };
    f.bx = 2 * f.h - (f.x0 + pw);
    setImg(fsheet, f.front); fsheet.style.left = f.x0 + 'px';
    setImg(back, f.back); back.style.left = f.bx + 'px';
    under.style.visibility = f.under == null ? 'hidden' : '';
    if (f.under != null) { setImg(under, f.under); under.style.left = f.ux + 'px'; }
    if (f.hide != null) slots[f.hide].style.visibility = 'hidden';
    F = f; book.classList.add('flip'); renderFlip();
    return f;
  }
  function constrain(P) {
    [{ x: F.h, y: 0 }, { x: F.h, y: H }].forEach(function (A) {
      var r = Math.hypot(F.C.x - A.x, F.C.y - A.y), dx = P.x - A.x, dy = P.y - A.y, d = Math.hypot(dx, dy);
      if (d > r) { P.x = A.x + dx * r / d; P.y = A.y + dy * r / d; }
    });
    return P;
  }
  function band(wrap, pts, M, u, stops) {
    var D = Math.hypot(n * pw, H) * 2, i = wrap.firstChild;
    wrap.style.clipPath = poly(pts, 0);
    i.style.left = M.x - D + 'px'; i.style.top = M.y - D + 'px'; i.style.width = i.style.height = 2 * D + 'px';
    i.style.transform = 'rotate(' + Math.atan2(u.y, u.x) + 'rad)';
    i.style.background = 'linear-gradient(to right,' + stops.map(function (s) { return s[0] + ' ' + (D + s[1]) + 'px'; }).join(',') + ')';
  }
  function renderFlip() {
    var C = F.C, P = F.P, dx = C.x - P.x, dy = C.y - P.y, len = Math.hypot(dx, dy);
    var rect = [{ x: F.x0, y: 0 }, { x: F.x0 + pw, y: 0 }, { x: F.x0 + pw, y: H }, { x: F.x0, y: H }];
    if (len < 0.5) {
      fsheet.style.clipPath = 'none'; backWrap.style.visibility = shadeU.style.visibility = shadeF.style.visibility = shadeB.style.visibility = 'hidden';
      return;
    }
    backWrap.style.visibility = shadeU.style.visibility = shadeF.style.visibility = shadeB.style.visibility = '';
    var u = { x: dx / len, y: dy / len }, M = { x: (C.x + P.x) / 2, y: (C.y + P.y) / 2 };
    var front = clipHalf(rect, M, u, -1), fold = clipHalf(rect, M, u, 1);
    var md = M.x * u.x + M.y * u.y;
    var refl = function (p) { var s = 2 * (p.x * u.x + p.y * u.y - md); return { x: p.x - s * u.x, y: p.y - s * u.y }; };
    var flap = fold.map(refl);
    fsheet.style.clipPath = poly(front, F.x0);
    // Cara trasera: reflejo en la bisagra y luego en la línea de pliegue
    var a = -(1 - 2 * u.x * u.x), b = 2 * u.x * u.y, c = -2 * u.x * u.y, d = 1 - 2 * u.y * u.y;
    var o = refl({ x: 2 * F.h - F.bx, y: 0 });
    back.style.transform = 'matrix(' + [a, b, c, d, o.x - F.bx, o.y].map(function (v) { return v.toFixed(4); }).join(',') + ')';
    back.style.clipPath = poly(fold.map(function (p) { return { x: 2 * F.h - p.x, y: p.y }; }), F.bx);
    var prog = Math.min(1, Math.abs(P.x - F.C.x) / Math.abs(F.M.x - F.C.x || 1));
    var al = 0.45 * Math.min(1, prog * 5, (1 - prog) * 5 + 0.15), sw = pw * (0.08 + 0.25 * Math.min(prog, 1 - prog));
    var fade = n === 1 ? Math.min(1, Math.abs(P.x - F.M.x) / (0.6 * pw)) : 1;   // en una página, la hoja pasada se desvanece
    backWrap.style.opacity = shadeB.style.opacity = fade.toFixed(3);
    backWrap.style.filter = 'drop-shadow(0 0 ' + (6 + 10 * al).toFixed(1) + 'px rgba(0,0,0,' + (al * 0.8).toFixed(2) + '))';
    band(shadeU, fold, M, u, [['rgba(0,0,0,' + al.toFixed(2) + ')', 0], ['rgba(0,0,0,0)', sw]]);
    band(shadeF, front, M, u, [['rgba(0,0,0,0)', -sw * 0.6], ['rgba(0,0,0,' + (al * 0.5).toFixed(2) + ')', 0]]);
    band(shadeB, flap, M, u, [['rgba(0,0,0,0)', -sw * 1.4], ['rgba(255,255,255,.22)', -sw * 0.35], ['rgba(0,0,0,' + (al * 0.6).toFixed(2) + ')', 0]]);
  }
  function endFlip() {
    book.classList.remove('flip');
    slots[0].style.visibility = slots[1].style.visibility = '';
    F = null;
  }
  function animateFlip(target, ms, arc, done) {
    var f = F, from = { x: f.P.x, y: f.P.y }, t0 = performance.now();
    cancelAnimationFrame(f.raf); f.busy = true;
    (function tick(now) {
      if (F !== f) return;
      var t = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - t, 3);
      f.P = { x: from.x + (target.x - from.x) * e, y: from.y + (target.y - from.y) * e - arc * Math.sin(Math.PI * t) };
      renderFlip();
      if (t < 1) f.raf = requestAnimationFrame(tick); else done();
    })(t0);
  }
  function finish(complete) {
    var f = F, target = complete ? f.P1 : f.P0;
    var ms = 180 + 380 * Math.abs(target.x - f.P.x) / Math.abs(f.P1.x - f.P0.x || 1);
    animateFlip(target, ms, 0, function () {
      if (complete) show(f.to, true, endFlip); else endFlip();
    });
  }
  function turn(dir) {                                     // botones y teclado: hoja animada desde la esquina inferior
    if (F) return;
    var f = flipSetup(dir, H);
    if (!f) return;
    animateFlip(f.P1, 650, H * 0.18, function () { show(f.to, true, endFlip); });
  }

  // ---- Controles ----
  function cancelFlip() { if (F) { cancelAnimationFrame(F.raf); endFlip(); } }
  function setMode(two) {
    cancelFlip();
    S.two = two;
    $('mode').innerHTML = two
      ? '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="8" height="14" rx="1"/><rect x="13" y="5" width="8" height="14" rx="1"/></svg>'
      : '<svg viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="16" rx="1"/></svg>';
    show(S.page, true);
  }
  function rotate(d) { cancelFlip(); animated(function () { S.rot += d; S.x = S.y = 0; layout(); }); save(); }
  $('prev').onclick = function () { turn(-1); };
  $('next').onclick = function () { turn(1); };
  $('mode').onclick = function () { setMode(!S.two); };
  $('rotl').onclick = function () { rotate(-90); };
  $('rotr').onclick = function () { rotate(90); };
  $('zin').onclick = function () { animated(function () { zoomAt(S.z * 1.5, 0, 0); }); };
  $('zout').onclick = function () { animated(function () { zoomAt(S.z / 1.5, 0, 0); }); };
  $('fit').onclick = function () { animated(function () { S.z = 1; S.x = S.y = 0; apply(); }); };
  var FS_IN = '<svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>',
      FS_OUT = '<svg viewBox="0 0 24 24"><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/></svg>';
  function fsIcon() {
    var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    $('full').innerHTML = on ? FS_OUT : FS_IN; $('full').title = on ? 'Salir de pantalla completa (F)' : 'Pantalla completa (F)';
  }
  document.addEventListener('fullscreenchange', fsIcon); document.addEventListener('webkitfullscreenchange', fsIcon);
  $('full').onclick = function () {
    var d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (el.requestFullscreen || el.webkitRequestFullscreen) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  };
  slider.oninput = function () { cancelFlip(); show(+slider.value); };
  addEventListener('keydown', function (e) {
    if (e.target === slider && /Arrow/.test(e.key)) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') turn(1);
    else if (k === 'ArrowLeft' || k === 'PageUp') turn(-1);
    else if (k === 'Home') { cancelFlip(); show(0); }
    else if (k === 'End') { cancelFlip(); show(LAST); }
    else if (k === '+' || k === '=') $('zin').onclick();
    else if (k === '-') $('zout').onclick();
    else if (k === '0' || k === 'Escape') $('fit').onclick();
    else if (k === 'r') rotate(90);
    else if (k === 'R') rotate(-90);
    else if (k === 'd' || k === 'D') setMode(!S.two);
    else if (k === 'f' || k === 'F') $('full').onclick();
    else return;
    e.preventDefault();
  });
  addEventListener('resize', function () { cancelFlip(); layout(); });

  // ---- Gestos: esquinas/laterales para pasar hoja; arrastrar, pellizcar, rueda, doble toque ----
  var Pt = new Map(), g = null, lastTap = 0;
  function edgeDir(L) {
    var W = n * pw, zone = Math.max(pw * 0.14, 40) / S.z, m = 24 / S.z;   // mismo tamaño en pantalla con cualquier zoom
    if (L.y < -m || L.y > H + m) return 0;
    if (L.x > W - zone && L.x < W + m) return 1;
    if (L.x < zone && L.x > -m) return -1;
    return 0;
  }
  stage.addEventListener('pointerdown', function (e) {
    stage.setPointerCapture(e.pointerId); Pt.set(e.pointerId, [e.clientX, e.clientY]);
    book.classList.remove('anim');
    if (Pt.size === 1) {
      var L = toLocal(e), dir = F ? 0 : edgeDir(L);
      var f = dir && flipSetup(dir, Math.max(0, Math.min(H, L.y)));
      if (f) g = { flip: f, L0: L, t: Date.now(), moved: false, vx: 0, lx: L.x, lt: Date.now() };
      else { g = { x0: e.clientX, y0: e.clientY, px: S.x, py: S.y, t: Date.now(), moved: false }; if (S.z > 1) stage.classList.add('drag'); }
    } else if (Pt.size === 2) {
      if (g && g.flip && F === g.flip) finish(false);
      var v = Array.from(Pt.values());
      g = { pinch: true, d0: Math.hypot(v[0][0] - v[1][0], v[0][1] - v[1][1]), z0: S.z, moved: true };
    }
  });
  stage.addEventListener('pointermove', function (e) {
    if (!Pt.has(e.pointerId) || !g) return;
    Pt.set(e.pointerId, [e.clientX, e.clientY]);
    if (g.flip) {
      if (F !== g.flip || F.busy) return;
      var L = toLocal(e), now = Date.now();
      if (Math.abs(L.x - g.L0.x) + Math.abs(L.y - g.L0.y) > 4) g.moved = true;
      g.vx = 0.7 * g.vx + 0.3 * (L.x - g.lx) / Math.max(1, now - g.lt); g.lx = L.x; g.lt = now;
      F.P = constrain({ x: F.P0.x + (L.x - g.L0.x) * F.k, y: F.P0.y + (L.y - g.L0.y) });
      renderFlip();
      return;
    }

    if (g.pinch && Pt.size === 2) {
      var v = Array.from(Pt.values()), r = stage.getBoundingClientRect();
      var d = Math.hypot(v[0][0] - v[1][0], v[0][1] - v[1][1]);
      var mx = (v[0][0] + v[1][0]) / 2 - r.left - vw / 2, my = (v[0][1] + v[1][1]) / 2 - r.top - vh / 2;
      if (g.mx !== undefined) { S.x += mx - g.mx; S.y += my - g.my; }
      g.mx = mx; g.my = my;
      zoomAt(g.z0 * d / g.d0, mx, my);
    } else if (!g.pinch) {
      var dx = e.clientX - g.x0, dy = e.clientY - g.y0;
      if (Math.abs(dx) + Math.abs(dy) > 6) g.moved = true;
      if (S.z > 1) { S.x = g.px + dx; S.y = g.py + dy; apply(); }
    }
  });
  function up(e) {
    if (!Pt.has(e.pointerId)) return;
    Pt.delete(e.pointerId); stage.classList.remove('drag');
    if (!g) return;
    if (g.flip) {
      var gg = g, f = g.flip; g = null;
      if (F !== f || f.busy) return;
      if (e.type === 'pointercancel') { finish(false); return; }
      if (!gg.moved) {                                     // toque en el borde: la hoja pasa sola
        animateFlip(f.P1, 650, (f.C.y > H / 2 ? 1 : -1) * H * 0.15, function () { show(f.to, true, endFlip); });
        return;
      }
      var s = Math.sign(f.P1.x - f.P0.x), done = Math.abs(f.P.x - f.P1.x) < Math.abs(f.P.x - f.P0.x);
      if (s * gg.vx > 0.35) done = true; else if (s * gg.vx < -0.35) done = false;
      finish(done);
      return;
    }
    if (g.pinch) {
      if (Pt.size === 1) { var q = Array.from(Pt.values())[0]; g = { x0: q[0], y0: q[1], px: S.x, py: S.y, t: 0, moved: true }; }
      else g = null;
      return;
    }
    var dt = Date.now() - g.t;
    if (!g.moved && dt < 300) {                          // doble toque: acercar / ajustar
      var now = Date.now(), c = rel(e);
      if (now - lastTap < 300) {
        lastTap = 0;
        animated(function () { if (S.z > 1.05) { S.z = 1; S.x = S.y = 0; apply(); } else zoomAt(2.5, c[0], c[1]); });
      } else lastTap = now;
    }
    g = null;
  }
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', function (e) {
    e.preventDefault(); if (F) return;
    book.classList.remove('anim');
    var c = rel(e);
    zoomAt(S.z * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), c[0], c[1]);
  }, { passive: false });
  // Safari (iPhone/iPad) ignora user-scalable=no: se bloquea su zoom de página
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  var lastEnd = 0;
  document.addEventListener('touchend', function (e) { var t = Date.now(); if (t - lastEnd < 300) e.preventDefault(); lastEnd = t; }, { passive: false });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  setMode(S.two);
})();
</script>
</body>
</html>
